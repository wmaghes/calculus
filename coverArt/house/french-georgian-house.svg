<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 1000" width="1600" height="1000">
  <title>French-Georgian Revival Residence, rear elevation with patio and pool</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fa6d6"/>
      <stop offset="0.55" stop-color="#c9d7e6"/>
      <stop offset="1" stop-color="#f7d3a8"/>
    </linearGradient>
    <linearGradient id="lawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6f9a4a"/>
      <stop offset="1" stop-color="#3f6b2c"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe3a3"/>
      <stop offset="1" stop-color="#d08a3c"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fd0dc"/>
      <stop offset="1" stop-color="#1a86ad"/>
    </linearGradient>
    <linearGradient id="slate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3c4552"/>
      <stop offset="1" stop-color="#58626f"/>
    </linearGradient>
    <pattern id="brick" width="24" height="10" patternUnits="userSpaceOnUse">
      <rect width="24" height="10" fill="#b0583d"/>
      <path d="M0 9.5H24M0 4.5H24M6 0V4.5M18 5V10" stroke="#e7d7c4" stroke-width="0.9" opacity="0.55"/>
    </pattern>
    <pattern id="shingle" width="16" height="10" patternUnits="userSpaceOnUse">
      <rect width="16" height="10" fill="url(#slate)"/>
      <path d="M0 9.5H16M0 4.5H16M4 0V4.5M12 5V10" stroke="#2a3139" stroke-width="0.8" opacity="0.7"/>
    </pattern>
    <pattern id="paver" width="40" height="20" patternUnits="userSpaceOnUse">
      <rect width="40" height="20" fill="#e2d6c1"/>
      <path d="M0 19.5H40M20 0V10M0 10H40M10 10V20M30 10V20" stroke="#c4b598" stroke-width="1"/>
    </pattern>

    <!-- Upper-floor window: limestone surround, keystone, black shutters -->
    <g id="win">
      <rect x="-48" y="0" width="16" height="80" fill="#1f2a26"/>
      <rect x="32" y="0" width="16" height="80" fill="#1f2a26"/>
      <path d="M-46 8H-34M-46 72H-34M34 8H46M34 72H46" stroke="#3b4a44" stroke-width="2"/>
      <rect x="-30" y="-6" width="60" height="92" fill="#efe6d6"/>
      <rect x="-22" y="0" width="44" height="80" fill="url(#glass)"/>
      <path d="M0 0V80M-22 20H22M-22 40H22M-22 60H22" stroke="#f8f4ec" stroke-width="2.5"/>
      <polygon points="-8,-6 8,-6 6,-16 -6,-16" fill="#f5eee2" stroke="#cfc3ad"/>
      <rect x="-34" y="84" width="68" height="6" fill="#e3d8c4"/>
    </g>

    <!-- Arched French door with limestone surround -->
    <g id="fdoor">
      <path d="M-36 114V26A36 36 0 0 1 36 26V114Z" fill="#efe6d6"/>
      <path d="M-27 114V26A27 27 0 0 1 27 26V114Z" fill="url(#glass)"/>
      <path d="M0 -1V114M-27 26H27M-27 50H27M-27 74H27M-27 96H27" stroke="#f8f4ec" stroke-width="2.5"/>
      <path d="M-19 7L0 26L19 7M0 -1V26" stroke="#f8f4ec" stroke-width="2" fill="none"/>
      <polygon points="-7,-10 7,-10 5,1 -5,1" fill="#f5eee2" stroke="#cfc3ad"/>
    </g>

    <!-- Mansard dormer with segmental arch hood -->
    <g id="dormer">
      <path d="M-30 70V16Q0 -12 30 16V70Z" fill="#efe6d6"/>
      <path d="M-34 18Q0 -18 34 18" stroke="#8a6a3b" stroke-width="6" fill="none"/>
      <path d="M-18 66V22A18 18 0 0 1 18 22V66Z" fill="url(#glass)"/>
      <path d="M0 4V66M-18 30H18M-18 48H18" stroke="#f8f4ec" stroke-width="2"/>
    </g>

    <!-- Wrought-iron balconette -->
    <g id="rail">
      <rect x="-40" y="0" width="80" height="3" fill="#1b1b1b"/>
      <rect x="-40" y="22" width="80" height="3" fill="#1b1b1b"/>
      <path d="M-36 3V22M-28 3V22M-20 3V22M-12 3V22M-4 3V22M4 3V22M12 3V22M20 3V22M28 3V22M36 3V22" stroke="#1b1b1b" stroke-width="1.5"/>
      <path d="M-24 12a6 6 0 1 0 12 0a6 6 0 1 0 -12 0M12 12a6 6 0 1 0 12 0a6 6 0 1 0 -12 0" stroke="#1b1b1b" stroke-width="1.2" fill="none"/>
    </g>

    <g id="tree">
      <circle cx="0" cy="0" r="70" fill="#2f5a2a"/>
      <circle cx="-50" cy="40" r="55" fill="#35632e"/>
      <circle cx="50" cy="35" r="60" fill="#2a5226"/>
      <circle cx="10" cy="-50" r="50" fill="#3b6c33"/>
      <circle cx="-20" cy="-20" r="30" fill="#4a7d3d" opacity="0.6"/>
    </g>

    <g id="lounger">
      <path d="M0 0L90 0L96 14L6 14Z" fill="#f4f1ea" stroke="#bfb6a6"/>
      <path d="M0 0L-10 -26L6 -30L18 0Z" fill="#f4f1ea" stroke="#bfb6a6"/>
      <path d="M8 14V24M90 14V24" stroke="#6d6250" stroke-width="3"/>
    </g>

    <g id="topiary">
      <path d="M-18 0H18L14 30H-14Z" fill="#8a7a62"/>
      <ellipse cx="0" cy="-22" rx="20" ry="24" fill="#2f5d2c"/>
      <ellipse cx="0" cy="-52" rx="14" ry="16" fill="#35682f"/>
    </g>
    <path id="bal" fill="#f3ebdd" d="M0 0h8v4q-3 4 0 8q4 5 0 10h-8q-4-5 0-10q3-4 0-8z"/>
  </defs>

  <!-- Sky & background -->
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <g fill="#fff" opacity="0.55">
    <ellipse cx="260" cy="120" rx="120" ry="22"/><ellipse cx="330" cy="105" rx="70" ry="20"/>
    <ellipse cx="1300" cy="90" rx="140" ry="20"/><ellipse cx="1230" cy="78" rx="70" ry="18"/>
  </g>
  <!-- Distant tree line -->
  <path d="M0 520Q60 430 130 470T260 440T420 460T560 420T700 450T860 410T1020 450T1180 420T1340 455T1480 425T1600 460V600H0Z" fill="#577a4a" opacity="0.8"/>

  <!-- Lawn -->
  <rect x="0" y="555" width="1600" height="445" fill="url(#lawn)"/>

  <!-- Chimneys (behind roof) -->
  <g>
    <rect x="478" y="118" width="46" height="100" fill="url(#brick)"/>
    <rect x="472" y="110" width="58" height="10" fill="#efe6d6"/>
    <rect x="486" y="96" width="12" height="16" fill="#9a5a3a"/><rect x="504" y="96" width="12" height="16" fill="#9a5a3a"/>
    <rect x="1076" y="118" width="46" height="100" fill="url(#brick)"/>
    <rect x="1070" y="110" width="58" height="10" fill="#efe6d6"/>
    <rect x="1084" y="96" width="12" height="16" fill="#9a5a3a"/><rect x="1102" y="96" width="12" height="16" fill="#9a5a3a"/>
  </g>

  <!-- Main block mansard roof -->
  <polygon points="436,302 1164,302 1116,196 484,196" fill="url(#shingle)"/>
  <polygon points="484,196 1116,196 1090,182 510,182" fill="#4a535f"/>
  <rect x="505" y="176" width="590" height="7" fill="#8a6a3b"/>
  <path d="M436 302L484 196M1164 302L1116 196" stroke="#8a6a3b" stroke-width="4"/>

  <!-- Dormers -->
  <use href="#dormer" x="550" y="220"/>
  <use href="#dormer" x="650" y="220"/>
  <use href="#dormer" x="950" y="220"/>
  <use href="#dormer" x="1050" y="220"/>

  <!-- Wings: one-and-a-half story with mansard -->
  <polygon points="236,432 460,432 440,372 256,372" fill="url(#shingle)"/>
  <rect x="254" y="366" width="188" height="7" fill="#8a6a3b"/>
  <polygon points="1140,432 1364,432 1344,372 1160,372" fill="url(#shingle)"/>
  <rect x="1158" y="366" width="188" height="7" fill="#8a6a3b"/>
  <rect x="248" y="432" width="200" height="130" fill="url(#brick)"/>
  <rect x="1152" y="432" width="200" height="130" fill="url(#brick)"/>
  <rect x="240" y="428" width="216" height="8" fill="#efe6d6"/>
  <rect x="1144" y="428" width="216" height="8" fill="#efe6d6"/>
  <g transform="translate(305,445)"><use href="#fdoor"/></g>
  <g transform="translate(392,445)"><use href="#fdoor"/></g>
  <g transform="translate(1208,445)"><use href="#fdoor"/></g>
  <g transform="translate(1295,445)"><use href="#fdoor"/></g>

  <!-- Main block brick walls -->
  <rect x="446" y="302" width="708" height="260" fill="url(#brick)"/>
  <!-- Limestone quoins -->
  <g fill="#efe6d6">
    <rect x="446" y="310" width="22" height="16"/><rect x="446" y="336" width="14" height="16"/>
    <rect x="446" y="362" width="22" height="16"/><rect x="446" y="388" width="14" height="16"/>
    <rect x="446" y="414" width="22" height="16"/><rect x="446" y="440" width="14" height="16"/>
    <rect x="446" y="466" width="22" height="16"/><rect x="446" y="492" width="14" height="16"/>
    <rect x="446" y="518" width="22" height="16"/><rect x="446" y="544" width="14" height="16"/>
    <rect x="1132" y="310" width="22" height="16"/><rect x="1140" y="336" width="14" height="16"/>
    <rect x="1132" y="362" width="22" height="16"/><rect x="1140" y="388" width="14" height="16"/>
    <rect x="1132" y="414" width="22" height="16"/><rect x="1140" y="440" width="14" height="16"/>
    <rect x="1132" y="466" width="22" height="16"/><rect x="1140" y="492" width="14" height="16"/>
    <rect x="1132" y="518" width="22" height="16"/><rect x="1140" y="544" width="14" height="16"/>
  </g>
  <!-- Belt course between floors -->
  <rect x="446" y="424" width="708" height="9" fill="#efe6d6"/>

  <!-- Central projecting limestone pavilion with pediment -->
  <rect x="712" y="302" width="176" height="260" fill="#ece2d0"/>
  <path d="M712 302V562M888 302V562" stroke="#d2c5ad" stroke-width="3"/>
  <polygon points="700,304 800,244 900,304" fill="#efe6d6" stroke="#cdbfa6" stroke-width="3"/>
  <circle cx="800" cy="284" r="13" fill="url(#glass)" stroke="#cdbfa6" stroke-width="3"/>

  <!-- Cornice with dentils -->
  <rect x="436" y="296" width="728" height="10" fill="#f3ebdd"/>
  <g fill="#d9ccb4">
    <rect x="446" y="306" width="708" height="4"/>
  </g>

  <!-- Upper windows (7 bays) -->
  <use href="#win" x="510" y="334"/>
  <use href="#win" x="620" y="334"/>
  <use href="#win" x="980" y="334"/>
  <use href="#win" x="1090" y="334"/>
  <!-- Central pavilion upper windows: no shutters, tall French casements -->
  <g transform="translate(800,322)">
    <rect x="-34" y="-8" width="68" height="104" fill="#f6efe3"/>
    <rect x="-26" y="0" width="52" height="92" fill="url(#glass)"/>
    <path d="M0 0V92M-26 23H26M-26 46H26M-26 69H26" stroke="#f8f4ec" stroke-width="2.5"/>
    <use href="#rail" x="0" y="72"/>
  </g>
  <g transform="translate(740,340)"><rect x="-10" y="0" width="20" height="70" fill="url(#glass)" stroke="#f6efe3" stroke-width="3"/></g>
  <g transform="translate(860,340)"><rect x="-10" y="0" width="20" height="70" fill="url(#glass)" stroke="#f6efe3" stroke-width="3"/></g>

  <!-- Ground floor arched French doors -->
  <g transform="translate(510,448)"><use href="#fdoor"/></g>
  <g transform="translate(620,448)"><use href="#fdoor"/></g>
  <g transform="translate(800,448)"><use href="#fdoor"/></g>
  <g transform="translate(980,448)"><use href="#fdoor"/></g>
  <g transform="translate(1090,448)"><use href="#fdoor"/></g>
  <!-- Pilasters on central pavilion -->
  <g fill="#f6efe3" stroke="#d2c5ad">
    <rect x="740" y="440" width="14" height="122"/><rect x="846" y="440" width="14" height="122"/>
  </g>

  <!-- Water table / foundation -->
  <rect x="236" y="558" width="1128" height="10" fill="#d8ccb6"/>

  <!-- Stone terrace -->
  <polygon points="190,566 1410,566 1450,646 150,646" fill="url(#paver)"/>
  <!-- Balustrade -->
  <g>
    <rect x="150" y="614" width="560" height="6" fill="#f3ebdd"/>
    <rect x="890" y="614" width="560" height="6" fill="#f3ebdd"/>
    <rect x="150" y="640" width="560" height="8" fill="#e6dbc6"/>
    <rect x="890" y="640" width="560" height="8" fill="#e6dbc6"/>
  </g>
  <g id="balusters"><use href="#bal" x="172" y="620"/><use href="#bal" x="188" y="620"/><use href="#bal" x="204" y="620"/><use href="#bal" x="220" y="620"/><use href="#bal" x="236" y="620"/><use href="#bal" x="252" y="620"/><use href="#bal" x="268" y="620"/><use href="#bal" x="284" y="620"/><use href="#bal" x="300" y="620"/><use href="#bal" x="316" y="620"/><use href="#bal" x="332" y="620"/><use href="#bal" x="348" y="620"/><use href="#bal" x="364" y="620"/><use href="#bal" x="380" y="620"/><use href="#bal" x="396" y="620"/><use href="#bal" x="412" y="620"/><use href="#bal" x="428" y="620"/><use href="#bal" x="444" y="620"/><use href="#bal" x="460" y="620"/><use href="#bal" x="476" y="620"/><use href="#bal" x="492" y="620"/><use href="#bal" x="508" y="620"/><use href="#bal" x="524" y="620"/><use href="#bal" x="540" y="620"/><use href="#bal" x="556" y="620"/><use href="#bal" x="572" y="620"/><use href="#bal" x="588" y="620"/><use href="#bal" x="604" y="620"/><use href="#bal" x="620" y="620"/><use href="#bal" x="636" y="620"/><use href="#bal" x="652" y="620"/><use href="#bal" x="668" y="620"/><use href="#bal" x="684" y="620"/><use href="#bal" x="908" y="620"/><use href="#bal" x="924" y="620"/><use href="#bal" x="940" y="620"/><use href="#bal" x="956" y="620"/><use href="#bal" x="972" y="620"/><use href="#bal" x="988" y="620"/><use href="#bal" x="1004" y="620"/><use href="#bal" x="1020" y="620"/><use href="#bal" x="1036" y="620"/><use href="#bal" x="1052" y="620"/><use href="#bal" x="1068" y="620"/><use href="#bal" x="1084" y="620"/><use href="#bal" x="1100" y="620"/><use href="#bal" x="1116" y="620"/><use href="#bal" x="1132" y="620"/><use href="#bal" x="1148" y="620"/><use href="#bal" x="1164" y="620"/><use href="#bal" x="1180" y="620"/><use href="#bal" x="1196" y="620"/><use href="#bal" x="1212" y="620"/><use href="#bal" x="1228" y="620"/><use href="#bal" x="1244" y="620"/><use href="#bal" x="1260" y="620"/><use href="#bal" x="1276" y="620"/><use href="#bal" x="1292" y="620"/><use href="#bal" x="1308" y="620"/><use href="#bal" x="1324" y="620"/><use href="#bal" x="1340" y="620"/><use href="#bal" x="1356" y="620"/><use href="#bal" x="1372" y="620"/><use href="#bal" x="1388" y="620"/><use href="#bal" x="1404" y="620"/><use href="#bal" x="1420" y="620"/></g>
  <!-- Steps -->
  <polygon points="710,646 890,646 900,662 700,662" fill="#ece2d0"/>
  <polygon points="700,662 900,662 912,680 688,680" fill="#e2d6c1"/>
  <polygon points="688,680 912,680 926,698 674,698" fill="#d8cbb3"/>
  <!-- Newel posts & urns -->
  <g fill="#f3ebdd" stroke="#cdbfa6">
    <rect x="696" y="600" width="18" height="48"/><rect x="886" y="600" width="18" height="48"/>
    <rect x="150" y="600" width="18" height="48"/><rect x="1432" y="600" width="18" height="48"/>
  </g>
  <use href="#topiary" x="705" y="570"/>
  <use href="#topiary" x="895" y="570"/>

  <!-- Hedges flanking house -->
  <rect x="0" y="560" width="160" height="50" rx="22" fill="#2c5627"/>
  <rect x="1440" y="560" width="160" height="50" rx="22" fill="#2c5627"/>

  <!-- Big trees -->
  <use href="#tree" x="90" y="420"/>
  <use href="#tree" x="1510" y="410"/>

  <!-- Terrace furniture: dining set and market umbrella -->
  <g>
    <rect x="1236" y="498" width="4" height="100" fill="#6d6250"/>
    <path d="M1170 510Q1238 460 1306 510Z" fill="#f2ede2" stroke="#c9bfae"/>
    <ellipse cx="1238" cy="598" rx="46" ry="8" fill="#6d6250"/>
    <rect x="1234" y="600" width="8" height="14" fill="#6d6250"/>
    <rect x="1178" y="590" width="20" height="24" fill="#6d6250" rx="3"/>
    <rect x="1280" y="590" width="20" height="24" fill="#6d6250" rx="3"/>
  </g>
  <g>
    <!-- Outdoor sofa & fire table on left -->
    <rect x="300" y="584" width="130" height="24" rx="6" fill="#f2ede2" stroke="#c9bfae"/>
    <rect x="300" y="574" width="130" height="14" rx="6" fill="#e6dfd1"/>
    <rect x="460" y="592" width="70" height="14" fill="#8a7a62"/>
    <path d="M472 592q6-14 12-4q6-16 12 0q6-10 10 4z" fill="#ffb347"/>
  </g>

  <!-- Pool deck -->
  <polygon points="520,698 1080,698 1330,960 270,960" fill="url(#paver)"/>
  <!-- Pool coping -->
  <polygon points="566,712 1034,712 1236,934 364,934" fill="#f3ebdd"/>
  <!-- Pool water -->
  <polygon points="578,722 1022,722 1216,922 384,922" fill="url(#water)"/>
  <polygon points="578,722 1022,722 1026,730 574,730" fill="#2a6f8c" opacity="0.6"/>
  <!-- House reflection shimmer -->
  <g stroke="#fff" stroke-width="2" fill="none" opacity="0.55">
    <path d="M620 760q20-6 40 0t40 0M760 780q20-6 40 0t40 0M900 760q20-6 40 0t40 0"/>
    <path d="M560 830q25-8 50 0t50 0M720 850q25-8 50 0t50 0M900 830q25-8 50 0t50 0M1040 860q25-8 50 0"/>
    <path d="M480 900q30-8 60 0t60 0M700 895q30-8 60 0t60 0M960 905q30-8 60 0t60 0"/>
  </g>
  <g fill="#ffe3a3" opacity="0.35">
    <rect x="782" y="730" width="36" height="60"/>
    <rect x="600" y="730" width="20" height="40"/><rect x="980" y="730" width="20" height="40"/>
  </g>
  <!-- Pool steps (Roman end) -->
  <path d="M740 922q60-40 120 0" fill="none" stroke="#bfe9ef" stroke-width="4"/>
  <path d="M760 922q40-26 80 0" fill="none" stroke="#bfe9ef" stroke-width="3"/>

  <!-- Loungers -->
  <use href="#lounger" x="360" y="760"/>
  <use href="#lounger" x="320" y="830"/>
  <g transform="translate(1240,760) scale(-1,1)"><use href="#lounger"/></g>
  <g transform="translate(1285,830) scale(-1,1)"><use href="#lounger"/></g>
  <!-- Poolside umbrella -->
  <rect x="292" y="700" width="4" height="120" fill="#6d6250"/>
  <path d="M230 716Q294 668 358 716Z" fill="#f2ede2" stroke="#c9bfae"/>

  <!-- Foreground boxwood parterre -->
  <rect x="0" y="940" width="1600" height="60" fill="#3a6630"/>
  <rect x="40" y="950" width="200" height="34" rx="16" fill="#2c5627"/>
  <rect x="1360" y="950" width="200" height="34" rx="16" fill="#2c5627"/>
  <use href="#topiary" x="250" y="930"/>
  <use href="#topiary" x="1350" y="930"/>

  <!-- Caption -->
  <g font-family="Georgia, 'Times New Roman', serif" fill="#fff">
    <rect x="1080" y="962" width="506" height="30" rx="4" fill="#000" opacity="0.35"/>
    <text x="1096" y="983" font-size="16">French Georgian Revival  ·  approx. 4,000 sq ft  ·  rear terrace &amp; pool</text>
  </g>

</svg>
