[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lexreview"
version = "0.1.0"
description = "Citation-backed discovery review assistant (development build: synthetic data only)"
requires-python = ">=3.11"
# Runtime dependencies are intentionally minimal. Exact pins with hashes live in
# requirements.lock (generated by pip-compile --generate-hashes).
dependencies = [
  "sqlcipher3-binary",
  "cryptography",
  "pypdfium2",
  "pytesseract",
  "Pillow",
  "python-docx",
  "openpyxl",
  "argon2-cffi",
  "pyotp",
  "fastapi",
  "httpx",
  "uvicorn",
  "numpy",
  "scipy",
  "reportlab",
]

[project.optional-dependencies]
# Used only to build the synthetic test corpus and run the checks. Never
# needed at runtime.
dev = ["pytest", "pikepdf", "msoffcrypto-tool", "pip-tools", "pip-audit", "bandit", "cyclonedx-bom"]

[project.scripts]
lexreview = "lexreview.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
