# Local setup: Postgres 16 + pgvector, the API, and (step 5) the frontend.
# Not runnable in the development sandbox (no Docker daemon); tested there
# against a native Postgres 16 + pgvector 0.6.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: copractice
      POSTGRES_USER: copractice
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5432:5432"]   # loopback only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copractice"]
      interval: 5s
      retries: 20
  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://copractice:${POSTGRES_PASSWORD}@db:5432/copractice
    volumes:
      - ${EMBED_MODEL_DIR:-./models}:/models:ro
      - ./ingest:/srv/ingest:ro
    depends_on: {db: {condition: service_healthy}}
    ports: ["127.0.0.1:8000:8000"]   # loopback only
volumes:
  pgdata:
