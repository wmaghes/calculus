<title>lexreview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600;700&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: chambers workspace. A fixed ink sidebar holds the matter and the grouped sections; a quiet top bar names the section and the signed-in role; one working column of white sheets on a cool ground. Brass appears only on the section mark and the active section. */
:root{
  --ground:#f3f4f6; --surface:#ffffff; --sunken:#f7f8fa; --ink:#0d1424; --ink-2:#384152; --muted:#687184;
  --line:#e1e4ea; --line-strong:#c9ced8;
  --accent:#1c3361; --accent-hover:#142749; --accent-ink:#ffffff; --accent-soft:#e9eef7;
  --brass:#99773a;
  --hl:#fbe3a0; --hl-ink:#1a1405;
  --ok:#1d6a48; --ok-soft:#e5f1eb; --warn:#875809; --warn-soft:#faf0dc; --bad:#9e2b2b; --bad-soft:#fbeaea;
  --side:#0d1628; --side-fg:#e8ebf2; --side-muted:#8993a8; --side-line:#1d2840; --side-hover:#162139;
  --shadow:0 1px 2px rgba(13,20,36,.05), 0 1px 1px rgba(13,20,36,.03);
  --display:"Libre Caslon Text", "Iowan Old Style", Georgia, "Times New Roman", serif;
  --body:"Instrument Sans", "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --side-w:264px;
  --t1:#2a78d6; --t2:#eb6834; --t3:#1baf7a; --t4:#eda100; --t5:#e87ba4; --t6:#008300;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#0a1019; --surface:#111927; --sunken:#0d1420; --ink:#e7ebf2; --ink-2:#c0c8d5; --muted:#8a94a7;
  --line:#212c3e; --line-strong:#33405a;
  --accent:#a3bbea; --accent-hover:#bfd0f1; --accent-ink:#0a1220; --accent-soft:#18243c;
  --brass:#cfb173;
  --hl:#5b4811; --hl-ink:#fff4d0;
  --ok:#72c79e; --ok-soft:#10261c; --warn:#e2b25d; --warn-soft:#2a2010; --bad:#ef8c8c; --bad-soft:#311616;
  --side:#060b14; --side-fg:#e7ebf2; --side-muted:#7f8aa0; --side-line:#172031; --side-hover:#101929;
  --shadow:0 1px 2px rgba(0,0,0,.4); --t1:#3987e5; --t2:#d95926; --t3:#199e70; --t4:#c98500; --t5:#d55181; --t6:#008300; color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#0a1019; --surface:#111927; --sunken:#0d1420; --ink:#e7ebf2; --ink-2:#c0c8d5; --muted:#8a94a7;
  --line:#212c3e; --line-strong:#33405a;
  --accent:#a3bbea; --accent-hover:#bfd0f1; --accent-ink:#0a1220; --accent-soft:#18243c;
  --brass:#cfb173;
  --hl:#5b4811; --hl-ink:#fff4d0;
  --ok:#72c79e; --ok-soft:#10261c; --warn:#e2b25d; --warn-soft:#2a2010; --bad:#ef8c8c; --bad-soft:#311616;
  --side:#060b14; --side-fg:#e7ebf2; --side-muted:#7f8aa0; --side-line:#172031; --side-hover:#101929;
  --shadow:0 1px 2px rgba(0,0,0,.4); --t1:#3987e5; --t2:#d95926; --t3:#199e70; --t4:#c98500; --t5:#d55181; --t6:#008300; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font:14.5px/1.55 var(--body);margin:0;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;text-wrap:balance;color:var(--ink)}
h1{font:400 2rem/1.15 var(--display);letter-spacing:-.01em}
h2{font:400 1.3rem/1.25 var(--display)}
h3{font:600 .95rem/1.3 var(--body)}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.sr{position:absolute;left:-9999px}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:var(--side-fg);position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto;display:flex;flex-direction:column;gap:28px;padding:26px 18px 22px}
.brand{display:flex;align-items:baseline;gap:9px;padding-inline:8px}
.brand .mark{font:400 1.45rem/1 var(--display);color:var(--brass)}
.brand .word{font:400 1.3rem/1 var(--display);letter-spacing:.01em}
.matter{border:1px solid var(--side-line);border-radius:8px;padding:12px 12px 13px;display:flex;flex-direction:column;gap:6px}
.label{font:600 .68rem/1.2 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.side .label{color:var(--side-muted)}
.matter .name{font:400 .98rem/1.35 var(--display)}
.matter .meta-s{font:400 .74rem/1.4 var(--mono);color:var(--side-muted)}
nav.tabs{display:flex;flex-direction:column;gap:18px}
.navgroup{display:flex;flex-direction:column;gap:2px}
.navgroup .label{padding:0 10px 6px}
nav.tabs button{position:relative;text-align:left;border:0;background:transparent;color:var(--side-fg);opacity:.78;padding:7px 10px;border-radius:6px;cursor:pointer;font-size:.9rem}
nav.tabs button:hover{background:var(--side-hover);opacity:1}
nav.tabs button[aria-current="page"]{background:var(--side-hover);opacity:1;font-weight:600}
nav.tabs button[aria-current="page"]::before{content:"";position:absolute;left:-18px;top:8px;bottom:8px;width:2px;background:var(--brass)}
.side-foot{margin-top:auto;font-size:.75rem;line-height:1.5;color:var(--side-muted);padding-inline:8px;display:flex;flex-direction:column;gap:6px}
.side-foot b{color:var(--side-fg);font-weight:600}

.work{min-width:0;display:flex;flex-direction:column}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb, var(--surface) 92%, transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-inline:clamp(16px,3vw,40px)}
.bar-in{max-width:1080px;margin:0 auto;min-height:58px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:10px}
.crumb{font-size:.86rem;color:var(--muted);display:flex;gap:8px;align-items:center;min-width:0}
.crumb b{color:var(--ink);font-weight:600}
.bar-right{margin-left:auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.demo-pill{display:inline-flex;align-items:center;gap:7px;font-size:.76rem;color:var(--ink-2);border:1px solid var(--line-strong);border-radius:999px;padding:4px 11px 4px 9px;white-space:nowrap}
.demo-pill i{width:6px;height:6px;border-radius:50%;background:var(--brass)}
.seg{display:inline-flex;background:var(--sunken);border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:6px;cursor:pointer;font-size:.84rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.role{display:flex;align-items:center;gap:8px}

main{width:100%;max-width:1080px;margin:0 auto;padding-inline:clamp(16px,3vw,40px);padding-block:34px 80px;display:flex;flex-direction:column;gap:20px;min-width:0}
.pagehead{display:flex;flex-direction:column;gap:8px;padding-bottom:6px}
.pagehead .label{color:var(--brass)}
.lede{color:var(--ink-2);max-width:68ch;font-size:.98rem}

@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;padding:16px 16px 12px;gap:12px}
  .matter,.side-foot{display:none}
  nav.tabs{flex-direction:row;gap:4px;overflow-x:auto;padding-bottom:4px;margin-inline:-4px}
  .navgroup{flex-direction:row;gap:2px}
  .navgroup .label{display:none}
  nav.tabs button{white-space:nowrap}
  nav.tabs button[aria-current="page"]::before{left:10px;right:10px;top:auto;bottom:2px;width:auto;height:2px}
  h1{font-size:1.6rem}
}

/* ---------- surfaces ---------- */
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:22px 24px;min-width:0;display:flex;flex-direction:column;gap:14px}
.sheet.flush{padding:0;gap:0}
.sheet-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px}
.sheet.flush .sheet-head{padding:18px 24px 14px;border-bottom:1px solid var(--line)}
.note{color:var(--muted);font-size:.86rem}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
@media (max-width:520px){.sheet{padding:18px 16px}.sheet.flush .sheet-head{padding:16px}}

/* ---------- coverage ledger ---------- */
.cov{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px;font-size:.86rem;color:var(--ink-2)}
.cov .label{color:var(--muted)}
.covbar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--line);width:120px;flex:none}
.covbar span{display:block;height:100%}
.covbar .s-ok{background:var(--ok)}.covbar .s-bad{background:var(--bad)}.covbar .s-held{background:var(--line-strong)}
.cov .gap{color:var(--bad);font-weight:600}
.cov .linkish{margin-left:auto}
.figures{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line)}
.figure{padding:18px 20px;display:flex;flex-direction:column;gap:4px;border-right:1px solid var(--line)}
.figure:last-child{border-right:0}
.figure b{font:400 2.1rem/1 var(--display);font-variant-numeric:tabular-nums;color:var(--ink)}
.figure span{font-size:.82rem;color:var(--muted)}
.figure.alert b{color:var(--bad)}
@media (max-width:640px){.figures{grid-template-columns:repeat(2,minmax(0,1fr))}.figure:nth-child(2){border-right:0}.figure:nth-child(-n+2){border-bottom:1px solid var(--line)}}
.bigbar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--line);margin:0 24px 20px}
.bigbar span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;padding:0 24px 18px;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:0}

/* ---------- query bar ---------- */
.query{display:flex;gap:8px;align-items:stretch}
.query input{flex:1;min-width:0}
input[type=text],input[type=date],select,textarea{background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:10px 12px;outline:none;transition:border-color .15s, box-shadow .15s}
input[type=text]:focus,input[type=date]:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.query input{font-size:1rem;padding:12px 14px}
input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px;vertical-align:-2px}
textarea,input.wide{width:100%}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:9px 16px;cursor:pointer;font-weight:600;font-size:.88rem;white-space:nowrap;transition:background .15s}
.btn:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line-strong);font-weight:500}
.btn.ghost:hover{background:var(--sunken)}
.btn.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.try{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.try .label{margin-right:4px}
.sugg{border:1px solid var(--line);background:var(--sunken);color:var(--ink-2);border-radius:999px;padding:4px 11px;font-size:.8rem;cursor:pointer}
.sugg:hover{border-color:var(--accent);color:var(--accent)}
.filters{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:end}
.filters label{display:flex;flex-direction:column;gap:5px;font-size:.78rem;color:var(--muted);font-weight:500}
.filters label.inline{flex-direction:row;align-items:center;gap:8px;font-size:.86rem;color:var(--ink-2);padding-bottom:10px}

/* ---------- pills ---------- */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:600;letter-spacing:.02em;padding:3px 9px;border-radius:999px;background:var(--sunken);color:var(--ink-2);border:1px solid var(--line);white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.85}
.pill.plain::before{display:none}
.pill.ok,.pill.strong{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.warn,.pill.moderate{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.weak{color:var(--muted)}
.pill.lead{background:var(--accent-soft);color:var(--accent);border-color:transparent}

/* ---------- results ---------- */
.results{display:flex;flex-direction:column;gap:12px}
.summary{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;font-size:.86rem;color:var(--muted);padding-inline:2px}
.summary b{color:var(--ink);font-weight:600}
.hit{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 20px;display:flex;flex-direction:column;gap:8px;min-width:0;transition:border-color .15s}
.hit:hover{border-color:var(--line-strong)}
.hit.flagged{border-color:color-mix(in srgb, var(--bad) 45%, var(--line));background:linear-gradient(var(--bad-soft),var(--bad-soft)) top/100% 3px no-repeat, var(--surface)}
.hit-head{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between}
.hit-title{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline;min-width:0}
.rank{font:500 .78rem/1 var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.doclink{background:none;border:0;padding:0;color:var(--ink);font-weight:600;font-size:.95rem;cursor:pointer;text-align:left;overflow-wrap:anywhere}
.doclink:hover{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.cite{font:400 .76rem/1.5 var(--mono);color:var(--muted);overflow-wrap:anywhere}
.excerpt{font-size:.9rem;line-height:1.6;color:var(--ink-2);white-space:pre-wrap;overflow-wrap:anywhere;background:var(--sunken);border-radius:6px;padding:10px 12px;margin:0;font-family:var(--body)}
blockquote.excerpt{font:400 .98rem/1.6 var(--display);color:var(--ink)}
.reasons{font-size:.84rem;color:var(--muted)}
.alertline{display:flex;gap:8px;align-items:flex-start;color:var(--bad);font-size:.84rem;font-weight:600}
.alertline::before{content:"!";flex:none;width:16px;height:16px;border-radius:50%;background:var(--bad);color:var(--surface);font:700 .7rem/16px var(--body);text-align:center;margin-top:1px}
.warnline{color:var(--warn);font-size:.84rem;font-weight:500}
.notfound{background:var(--surface);border:1px dashed var(--line-strong);border-radius:10px;padding:22px 24px;display:flex;flex-direction:column;gap:4px}
.notfound b{font:400 1.1rem/1.3 var(--display)}
.listhead{display:flex;flex-direction:column;gap:2px;margin-top:10px}
.listhead h2 .n{color:var(--muted);font-family:var(--body);font-size:.9rem;margin-left:6px}
.callout{border:1px solid var(--line);background:var(--sunken);border-radius:8px;padding:12px 14px;font-size:.88rem;color:var(--ink-2);display:flex;flex-direction:column;gap:4px}
.callout.caution{background:var(--warn-soft);border-color:transparent;color:var(--ink)}
.callout b{color:var(--ink)}

/* ---------- tables ---------- */
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th{font:600 .68rem/1.2 var(--body);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--sunken);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:color-mix(in srgb, var(--sunken) 70%, transparent)}
th:first-child,td:first-child{padding-left:24px}th:last-child,td:last-child{padding-right:24px}
td.num,th.num{font-variant-numeric:tabular-nums;text-align:right}
.date{font:500 .86rem/1.3 var(--mono);white-space:nowrap;color:var(--ink)}
.passage{font:400 .82rem/1.6 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;margin:0;color:var(--ink-2)}
mark{background:var(--hl);color:var(--hl-ink);padding:1px 2px;border-radius:2px}
.linkish{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:3px;cursor:pointer;text-align:left;font:inherit}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}

/* ---------- viewer ---------- */
.viewer{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:20px;align-items:start}
@media (max-width:980px){.viewer{grid-template-columns:minmax(0,1fr)}}
.paper{background:var(--surface);border:1px solid var(--line);border-radius:4px;box-shadow:0 1px 2px rgba(13,20,36,.06), 0 8px 24px -12px rgba(13,20,36,.18);padding:36px clamp(18px,4vw,48px);max-height:72vh;overflow:auto}
.paper .passage{font-size:.86rem;color:var(--ink)}
.pager{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.pager .note{font-variant-numeric:tabular-nums}
.aside{display:flex;flex-direction:column;gap:14px;position:sticky;top:76px}
.locbox{font:400 .78rem/1.55 var(--mono);color:var(--ink);background:var(--sunken);border:1px solid var(--line);border-radius:6px;padding:10px 12px;overflow-wrap:anywhere}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:.84rem}
.kv dt{color:var(--muted)}.kv dd{margin:0;color:var(--ink);overflow-wrap:anywhere}

/* ---------- audit ---------- */
.auditlog{list-style:none;margin:0;padding:0;font:400 .8rem/1.5 var(--mono)}
.auditlog li{display:grid;grid-template-columns:72px 82px minmax(0,1fr);gap:12px;padding:9px 24px;border-bottom:1px solid var(--line);color:var(--ink-2)}
.auditlog li:last-child{border-bottom:0}
.auditlog .t{color:var(--muted);font-variant-numeric:tabular-nums}
.auditlog .who{color:var(--accent)}
@media (max-width:520px){.auditlog li{grid-template-columns:64px minmax(0,1fr)}.auditlog .who{display:none}}
details.sheet summary{cursor:pointer;font-weight:600}
details ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:.88rem}
.leadcard{border:1px solid var(--line);border-radius:8px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.leadcard h3{font:400 1.08rem/1.3 var(--display)}
.srcstatus{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:.86rem}
.srcstatus li{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.checks{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:.88rem;color:var(--ink-2)}
.checks label{display:flex;align-items:center;gap:7px}
.outbound{font:500 .9rem/1.5 var(--mono);color:var(--ink);background:var(--sunken);border:1px solid var(--line);border-radius:6px;padding:10px 12px;overflow-wrap:anywhere}

/* ---------- topics donut ---------- */
.topics{display:grid;grid-template-columns:230px minmax(0,1fr);gap:28px;padding:22px 24px;align-items:center}
@media (max-width:720px){.topics{grid-template-columns:minmax(0,1fr);justify-items:center}}
.donutcol{position:relative;width:220px;max-width:100%}
.donut{position:relative}
.donut svg{width:100%;height:auto;display:block}
.donut path{cursor:pointer;transition:opacity .15s}
.donut path:focus{outline:none}
.donut path:focus-visible{stroke:var(--ink);stroke-width:3}
.donut path.dim{opacity:.28}
.donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.donut-center b{font:400 2rem/1 var(--display);font-variant-numeric:tabular-nums}
.donut-center span{font-size:.76rem;color:var(--muted)}
.tip{position:absolute;z-index:2;pointer-events:none;background:var(--ink);color:var(--surface);font-size:.76rem;font-weight:500;padding:6px 9px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-50%)}
.legendtbl th:first-child,.legendtbl td:first-child{padding-left:0}.legendtbl th:last-child,.legendtbl td:last-child{padding-right:0}
.legendtbl th{background:transparent}
.legendtbl tr.dim td{opacity:.5}
.topicbtn{display:inline-flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer;color:var(--ink);font:inherit;text-align:left}
.topicbtn:hover{color:var(--accent)}
.topicbtn[aria-pressed="true"]{font-weight:600}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;flex:none}
.topicfiles{border-top:1px solid var(--line);padding:16px 24px 20px;display:flex;flex-direction:column;gap:8px}
.topicfiles ul{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:6px 20px}

/* ---------- Second Chair ---------- */
.chair{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.chair-side{order:2;display:flex;flex-direction:column;gap:14px;position:sticky;top:76px}
.chair-main{order:1;min-width:0;display:flex;flex-direction:column;gap:16px}
@media (max-width:1100px){.chair{grid-template-columns:minmax(0,1fr)}.chair-side{order:0;position:static}}
.sideseg{display:grid;grid-template-columns:1fr 1fr;width:100%}
.sideseg button{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:8px 10px;text-align:left}
.sideseg button b{font-size:.84rem}.sideseg button span{font-size:.74rem;color:var(--muted);font-weight:400}
textarea{width:100%;resize:vertical;line-height:1.5;font-size:.9rem}
textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:820px){.actions{grid-template-columns:repeat(2,minmax(0,1fr))}}
.action{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:13px 14px;cursor:pointer;display:flex;flex-direction:column;gap:4px;box-shadow:var(--shadow);transition:border-color .15s}
.action:hover{border-color:var(--accent)}
.action b{font-size:.9rem;color:var(--ink)}.action span{font-size:.78rem;color:var(--muted);line-height:1.4}
.action[disabled]{opacity:.5;cursor:not-allowed}
.thread{display:flex;flex-direction:column;gap:14px}
.thread > *{scroll-margin-top:76px}
.msg-user{align-self:flex-end;max-width:min(80%,560px);background:var(--accent);color:var(--accent-ink);border-radius:12px 12px 3px 12px;padding:10px 14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:.92rem}
.msg{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:18px 22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.msg-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.who{display:flex;align-items:center;gap:8px;font-weight:600;font-size:.9rem}
.who .mark{font:400 1.1rem/1 var(--display);color:var(--brass)}
.intro{font:400 1.02rem/1.55 var(--display);color:var(--ink)}
.thinking{color:var(--muted);font-size:.9rem}
.thinking::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--brass);margin-right:10px;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.point{display:flex;flex-direction:column;gap:8px;padding-top:14px;border-top:1px solid var(--line)}
.point h3{font:400 1.08rem/1.35 var(--display)}
.point p{color:var(--ink-2);font-size:.92rem}
.quote{display:flex;flex-direction:column;gap:4px;padding:9px 12px;background:var(--sunken);border-radius:6px;min-width:0}
.quote q{font:italic 400 .93rem/1.5 var(--display);color:var(--ink);overflow-wrap:anywhere}
.quote .doclink{font-size:.84rem}
.steps{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:.9rem;color:var(--ink-2)}
.verline{font-size:.78rem;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.composer{display:flex;gap:8px;align-items:flex-end;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;box-shadow:var(--shadow);position:sticky;bottom:12px}
.composer textarea{border:0;box-shadow:none;padding:6px 8px;background:transparent}
.composer textarea:focus{box-shadow:none}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}

<script>

/* ---------- text processing (mirrors the app's tokenizer) ---------- */
const STOP = new Set(("a about above after again against all am an and any are as at be because been before being below between both but by can could did do does doing down during each everything few find for from further had has have having he her here hers him his how i if in into is it its itself just me more most my no nor not of off on once only or other our out over own same she should so some such than that the their them then there these they this those through to too under until up very was we were what when where which while who whom why will with would you your show list documents docs anything regarding related concerning involving").split(" "));

/* ---------- common pieces ---------- */

function injectionLine(){ return h("div",{class:"alertline"},"This document contains text that reads like instructions to an AI system. It was treated as plain text. Review with caution."); }

function pageHead(title, lede){ return h("header",{class:"pagehead"}, h("span",{class:"label"}, groupOf(S.tab==="viewer"?S.prev:S.tab)), h("h1",null,title), lede ? h("p",{class:"lede"},lede) : null); }

function notFound(){ return h("div",{class:"notfound"}, h("b",null,"Not found in the reviewed documents."), h("span",{class:"note"},"Nothing in the searchable documents supports a result. Files that could not be searched are listed on the Overview.")); }

/* ---------- navigation ---------- */
const NAV = [["Matter",[["overview","Overview"]]],
  ["Strategy",[["chair","Second Chair"]]],
  ["Review",[["search","Search"],["ask","Ask a question"]]],
  ["Analysis",[["timeline","Timeline"],["people","People & organizations"]]],
  ["Authority",[["legal","Legal research leads"]]],
  ["Record",[["audit","Audit log"]]]];
const TABS = NAV.flatMap(([,items])=>items);
function groupOf(tab){ for (const [g,items] of NAV) if (items.some(([k])=>k===tab)) return g; return ""; }
function labelOf(tab){ const t = TABS.find(([k])=>k===tab); return t ? t[1] : ""; }
function go(tab){ S.tab = tab; render(); window.scrollTo({top:0}); try{ if (tab !== "viewer") history.replaceState(null,"","#"+tab); }catch(e){} }

/* ---------- views ---------- */
/* ---------- discovery by topic (keyword rules, not a model) ---------- */
const TOPICS = [["temperature","Temperature excursions","--t1"],["claim","Cargo claim & insurance","--t2"],["contract","Contract terms","--t3"],
  ["testimony","Deposition testimony","--t4"],["records","Shipment records & production","--t5"],["other","Other correspondence","--t6"]];
function topicOf(d){
  if (!SEARCHABLE.has(d.status)) return null;
  const n = d.source_name;
  if (d.injection) return "other";
  if (/\/contracts\//.test(n)) return "contract";
  if (/\/depositions\//.test(n)) return "testimony";
  if (/\/(logs|large)\/|bill_of_lading/.test(n)) return "records";
  const t = (PAGES[d.doc_id]||[]).map(p=>p[2]).join(" ").toLowerCase(), cnt = re => (t.match(re)||[]).length;

}

function viewOverview(){
  const c = coverage();
  const vis = D.docs.filter(visible);
  const rows = vis.map(d=>{ const [lab,cls] = STATUS[d.status]||[d.status,""];
    return h("tr",null, h("td",null, locLink(d.doc_id,1,null,null), d.parent_id?h("div",{class:"cite"},"attachment"):null),
      h("td",null,h("div",{class:"row",style:"gap:6px"},h("span",{class:"pill "+cls},lab), d.injection?h("span",{class:"pill bad"},"AI-instruction text"):null, d.restriction?h("span",{class:"pill plain"},"Attorneys' eyes only"):null)),

function gatherPassages(question){

const flagged_ = doc => flagged(doc);

{"answer":"2-4 sentence summary","points":[{"kind":"argument|risk|strategy|evidence","title":"short heading","text":"1-3 sentences","citations":[{"id":"P1","quote":"exact words from P1"}]}],"next_steps":["short action"],"research_needed":["general legal issue"]}`;

function verifyLive(out, passages, question){

const PARTY = new Set(tokens("Harbor Point Cold Storage Meridian Freightways Inc LLC"));
const SYN = [[/notif|notic|told|call|inform/i, "notify notice notified called"], [/warm|hot|temperature|excursion/i, "excursion temperature reefer"],
  [/insur|coverage/i, "insurer insurance claim"], [/cap|limit/i, "limitation liability exceed"], [/maint|repair|compressor/i, "compressor maintenance flagged"]];
function offlineMessage(question, note){
  let qt = tokens(question).filter(t=>!PARTY.has(t));
  for (const [re, extra] of SYN) if (re.test(question)) qt.push(...tokens(extra));
  if (!qt.length) qt = tokens(question);
  const qset = new Set(qt), idf = t => Math.log(1 + CH.length/((DF[t]||0) + 1)), cands = [];
  for (const r of search([...qset].join(" "), 14)){ if (flagged(r.c.doc)) continue;
    // keep transcript markers ("7 A.") attached to their answer when splitting into sentences
    const sents = r.c.text.replace(/([^\n])\n(?!\n)/g,"$1 ").replace(/(^|\s)([QA])\./g,"$1$2\u2063").split(/(?<=[.!?])\s+|\n\s*\n/).map(x=>x.replace(/\u2063/g,".").trim());
    let best = -1, score = 0;
    sents.forEach((x,i)=>{ if (x.length < 12 || /SYNTHETIC TEST DOCUMENT|^(From|To|Date|Subject):/.test(x)) return;
      const sc = [...new Set(tokens(x))].filter(t=>qset.has(t)).reduce((a,t)=>a+idf(t),0); if (sc > score){ score = sc; best = i; } });
    if (best < 0) continue;
    let quote = sents[best];
    if (/\?$/.test(quote) && sents[best+1] && !/SYNTHETIC/.test(sents[best+1])){   // a transcript question with its answer
      quote += " " + sents[best+1];
      if (sents[best+1].length < 25 && sents[best+2] && !/SYNTHETIC|^\d*\s*Q\./.test(sents[best+2])) quote += " " + sents[best+2]; }
    const at = locateQuote(r.c.text, quote); if (!at) continue;
    cands.push({score, r, at});
  }
  cands.sort((x,y)=>y.score-x.score);
  const points = [], seen = new Set();
  for (const {r, at} of cands){ if (points.length >= 5) break; const q = r.c.text.slice(at[0],at[1]); if (seen.has(q)) continue; seen.add(q);
    points.push({kind:"evidence", title:shortName(DOC[r.c.doc].source_name), text:"", cites:[{doc:r.c.doc, page:r.c.page, s:r.c.s+at[0], e:r.c.s+at[1], quote:q}]}); }
  return {who:"chair", kind:"offline", title:question,
    intro: points.length ? "Here is where the documents address your question, most relevant first." : "Not found in the reviewed documents.",
    note, points, next: points.length ? ["Open each source to read it in context before relying on it.", "For drafted arguments and strategy, use the actions above."] : [], research:[],
    stats:{verified:points.length}};
}
async function askChair(question, preparedSection){
