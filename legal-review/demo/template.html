<title>lexreview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600;700&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: chambers workspace. A fixed ink sidebar holds the matter and the grouped sections; a quiet top bar names the section and the signed-in role; one working column of white sheets on a cool ground. Brass appears only on the section mark and the active section. */
:root{
  --ground:#f3f4f6; --surface:#ffffff; --sunken:#f7f8fa; --ink:#0d1424; --ink-2:#384152; --muted:#687184;
  --line:#e1e4ea; --line-strong:#c9ced8;
  --accent:#1c3361; --accent-hover:#142749; --accent-ink:#ffffff; --accent-soft:#e9eef7;
  --brass:#99773a;
  --hl:#fbe3a0; --hl-ink:#1a1405;
  --ok:#1d6a48; --ok-soft:#e5f1eb; --warn:#875809; --warn-soft:#faf0dc; --bad:#9e2b2b; --bad-soft:#fbeaea;
  --side:#0d1628; --side-fg:#e8ebf2; --side-muted:#8993a8; --side-line:#1d2840; --side-hover:#162139;
  --shadow:0 1px 2px rgba(13,20,36,.05), 0 1px 1px rgba(13,20,36,.03);
  --display:"Libre Caslon Text", "Iowan Old Style", Georgia, "Times New Roman", serif;
  --body:"Instrument Sans", "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --side-w:264px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#0a1019; --surface:#111927; --sunken:#0d1420; --ink:#e7ebf2; --ink-2:#c0c8d5; --muted:#8a94a7;
  --line:#212c3e; --line-strong:#33405a;
  --accent:#a3bbea; --accent-hover:#bfd0f1; --accent-ink:#0a1220; --accent-soft:#18243c;
  --brass:#cfb173;
  --hl:#5b4811; --hl-ink:#fff4d0;
  --ok:#72c79e; --ok-soft:#10261c; --warn:#e2b25d; --warn-soft:#2a2010; --bad:#ef8c8c; --bad-soft:#311616;
  --side:#060b14; --side-fg:#e7ebf2; --side-muted:#7f8aa0; --side-line:#172031; --side-hover:#101929;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#0a1019; --surface:#111927; --sunken:#0d1420; --ink:#e7ebf2; --ink-2:#c0c8d5; --muted:#8a94a7;
  --line:#212c3e; --line-strong:#33405a;
  --accent:#a3bbea; --accent-hover:#bfd0f1; --accent-ink:#0a1220; --accent-soft:#18243c;
  --brass:#cfb173;
  --hl:#5b4811; --hl-ink:#fff4d0;
  --ok:#72c79e; --ok-soft:#10261c; --warn:#e2b25d; --warn-soft:#2a2010; --bad:#ef8c8c; --bad-soft:#311616;
  --side:#060b14; --side-fg:#e7ebf2; --side-muted:#7f8aa0; --side-line:#172031; --side-hover:#101929;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font:14.5px/1.55 var(--body);margin:0;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;text-wrap:balance;color:var(--ink)}
h1{font:400 2rem/1.15 var(--display);letter-spacing:-.01em}
h2{font:400 1.3rem/1.25 var(--display)}
h3{font:600 .95rem/1.3 var(--body)}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.sr{position:absolute;left:-9999px}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:var(--side-fg);position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto;display:flex;flex-direction:column;gap:28px;padding:26px 18px 22px}
.brand{display:flex;align-items:baseline;gap:9px;padding-inline:8px}
.brand .mark{font:400 1.45rem/1 var(--display);color:var(--brass)}
.brand .word{font:400 1.3rem/1 var(--display);letter-spacing:.01em}
.matter{border:1px solid var(--side-line);border-radius:8px;padding:12px 12px 13px;display:flex;flex-direction:column;gap:6px}
.label{font:600 .68rem/1.2 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.side .label{color:var(--side-muted)}
.matter .name{font:400 .98rem/1.35 var(--display)}
.matter .meta-s{font:400 .74rem/1.4 var(--mono);color:var(--side-muted)}
nav.tabs{display:flex;flex-direction:column;gap:18px}
.navgroup{display:flex;flex-direction:column;gap:2px}
.navgroup .label{padding:0 10px 6px}
nav.tabs button{position:relative;text-align:left;border:0;background:transparent;color:var(--side-fg);opacity:.78;padding:7px 10px;border-radius:6px;cursor:pointer;font-size:.9rem}
nav.tabs button:hover{background:var(--side-hover);opacity:1}
nav.tabs button[aria-current="page"]{background:var(--side-hover);opacity:1;font-weight:600}
nav.tabs button[aria-current="page"]::before{content:"";position:absolute;left:-18px;top:8px;bottom:8px;width:2px;background:var(--brass)}
.side-foot{margin-top:auto;font-size:.75rem;line-height:1.5;color:var(--side-muted);padding-inline:8px;display:flex;flex-direction:column;gap:6px}
.side-foot b{color:var(--side-fg);font-weight:600}

.work{min-width:0;display:flex;flex-direction:column}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb, var(--surface) 92%, transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-inline:clamp(16px,3vw,40px)}
.bar-in{max-width:1080px;margin:0 auto;min-height:58px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:10px}
.crumb{font-size:.86rem;color:var(--muted);display:flex;gap:8px;align-items:center;min-width:0}
.crumb b{color:var(--ink);font-weight:600}
.bar-right{margin-left:auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.demo-pill{display:inline-flex;align-items:center;gap:7px;font-size:.76rem;color:var(--ink-2);border:1px solid var(--line-strong);border-radius:999px;padding:4px 11px 4px 9px;white-space:nowrap}
.demo-pill i{width:6px;height:6px;border-radius:50%;background:var(--brass)}
.seg{display:inline-flex;background:var(--sunken);border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:6px;cursor:pointer;font-size:.84rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.role{display:flex;align-items:center;gap:8px}

main{width:100%;max-width:1080px;margin:0 auto;padding-inline:clamp(16px,3vw,40px);padding-block:34px 80px;display:flex;flex-direction:column;gap:20px;min-width:0}
.pagehead{display:flex;flex-direction:column;gap:8px;padding-bottom:6px}
.pagehead .label{color:var(--brass)}
.lede{color:var(--ink-2);max-width:68ch;font-size:.98rem}

@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;padding:16px 16px 12px;gap:12px}
  .matter,.side-foot{display:none}
  nav.tabs{flex-direction:row;gap:4px;overflow-x:auto;padding-bottom:4px;margin-inline:-4px}
  .navgroup{flex-direction:row;gap:2px}
  .navgroup .label{display:none}
  nav.tabs button{white-space:nowrap}
  nav.tabs button[aria-current="page"]::before{left:10px;right:10px;top:auto;bottom:2px;width:auto;height:2px}
  h1{font-size:1.6rem}
}

/* ---------- surfaces ---------- */
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:22px 24px;min-width:0;display:flex;flex-direction:column;gap:14px}
.sheet.flush{padding:0;gap:0}
.sheet-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px}
.sheet.flush .sheet-head{padding:18px 24px 14px;border-bottom:1px solid var(--line)}
.note{color:var(--muted);font-size:.86rem}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
@media (max-width:520px){.sheet{padding:18px 16px}.sheet.flush .sheet-head{padding:16px}}

/* ---------- coverage ledger ---------- */
.cov{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px;font-size:.86rem;color:var(--ink-2)}
.cov .label{color:var(--muted)}
.covbar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--line);width:120px;flex:none}
.covbar span{display:block;height:100%}
.covbar .s-ok{background:var(--ok)}.covbar .s-bad{background:var(--bad)}.covbar .s-held{background:var(--line-strong)}
.cov .gap{color:var(--bad);font-weight:600}
.cov .linkish{margin-left:auto}
.figures{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line)}
.figure{padding:18px 20px;display:flex;flex-direction:column;gap:4px;border-right:1px solid var(--line)}
.figure:last-child{border-right:0}
.figure b{font:400 2.1rem/1 var(--display);font-variant-numeric:tabular-nums;color:var(--ink)}
.figure span{font-size:.82rem;color:var(--muted)}
.figure.alert b{color:var(--bad)}
@media (max-width:640px){.figures{grid-template-columns:repeat(2,minmax(0,1fr))}.figure:nth-child(2){border-right:0}.figure:nth-child(-n+2){border-bottom:1px solid var(--line)}}
.bigbar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--line);margin:0 24px 20px}
.bigbar span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;padding:0 24px 18px;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:0}

/* ---------- query bar ---------- */
.query{display:flex;gap:8px;align-items:stretch}
.query input{flex:1;min-width:0}
input[type=text],input[type=date],select,textarea{background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:10px 12px;outline:none;transition:border-color .15s, box-shadow .15s}
input[type=text]:focus,input[type=date]:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.query input{font-size:1rem;padding:12px 14px}
input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px;vertical-align:-2px}
textarea,input.wide{width:100%}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:9px 16px;cursor:pointer;font-weight:600;font-size:.88rem;white-space:nowrap;transition:background .15s}
.btn:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line-strong);font-weight:500}
.btn.ghost:hover{background:var(--sunken)}
.btn.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.try{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.try .label{margin-right:4px}
.sugg{border:1px solid var(--line);background:var(--sunken);color:var(--ink-2);border-radius:999px;padding:4px 11px;font-size:.8rem;cursor:pointer}
.sugg:hover{border-color:var(--accent);color:var(--accent)}
.filters{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:end}
.filters label{display:flex;flex-direction:column;gap:5px;font-size:.78rem;color:var(--muted);font-weight:500}
.filters label.inline{flex-direction:row;align-items:center;gap:8px;font-size:.86rem;color:var(--ink-2);padding-bottom:10px}

/* ---------- pills ---------- */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:600;letter-spacing:.02em;padding:3px 9px;border-radius:999px;background:var(--sunken);color:var(--ink-2);border:1px solid var(--line);white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.85}
.pill.plain::before{display:none}
.pill.ok,.pill.strong{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.warn,.pill.moderate{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.weak{color:var(--muted)}
.pill.lead{background:var(--accent-soft);color:var(--accent);border-color:transparent}

/* ---------- results ---------- */
.results{display:flex;flex-direction:column;gap:12px}
.summary{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;font-size:.86rem;color:var(--muted);padding-inline:2px}
.summary b{color:var(--ink);font-weight:600}
.hit{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 20px;display:flex;flex-direction:column;gap:8px;min-width:0;transition:border-color .15s}
.hit:hover{border-color:var(--line-strong)}
.hit.flagged{border-color:color-mix(in srgb, var(--bad) 45%, var(--line));background:linear-gradient(var(--bad-soft),var(--bad-soft)) top/100% 3px no-repeat, var(--surface)}
.hit-head{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between}
.hit-title{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline;min-width:0}
.rank{font:500 .78rem/1 var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.doclink{background:none;border:0;padding:0;color:var(--ink);font-weight:600;font-size:.95rem;cursor:pointer;text-align:left;overflow-wrap:anywhere}
.doclink:hover{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.cite{font:400 .76rem/1.5 var(--mono);color:var(--muted);overflow-wrap:anywhere}
.excerpt{font-size:.9rem;line-height:1.6;color:var(--ink-2);white-space:pre-wrap;overflow-wrap:anywhere;background:var(--sunken);border-radius:6px;padding:10px 12px;margin:0;font-family:var(--body)}
blockquote.excerpt{font:400 .98rem/1.6 var(--display);color:var(--ink)}
.reasons{font-size:.84rem;color:var(--muted)}
.alertline{display:flex;gap:8px;align-items:flex-start;color:var(--bad);font-size:.84rem;font-weight:600}
.alertline::before{content:"!";flex:none;width:16px;height:16px;border-radius:50%;background:var(--bad);color:var(--surface);font:700 .7rem/16px var(--body);text-align:center;margin-top:1px}
.warnline{color:var(--warn);font-size:.84rem;font-weight:500}
.notfound{background:var(--surface);border:1px dashed var(--line-strong);border-radius:10px;padding:22px 24px;display:flex;flex-direction:column;gap:4px}
.notfound b{font:400 1.1rem/1.3 var(--display)}
.listhead{display:flex;flex-direction:column;gap:2px;margin-top:10px}
.listhead h2 .n{color:var(--muted);font-family:var(--body);font-size:.9rem;margin-left:6px}
.callout{border:1px solid var(--line);background:var(--sunken);border-radius:8px;padding:12px 14px;font-size:.88rem;color:var(--ink-2);display:flex;flex-direction:column;gap:4px}
.callout.caution{background:var(--warn-soft);border-color:transparent;color:var(--ink)}
.callout b{color:var(--ink)}

/* ---------- tables ---------- */
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th{font:600 .68rem/1.2 var(--body);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--sunken);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:color-mix(in srgb, var(--sunken) 70%, transparent)}
th:first-child,td:first-child{padding-left:24px}th:last-child,td:last-child{padding-right:24px}
td.num,th.num{font-variant-numeric:tabular-nums;text-align:right}
.date{font:500 .86rem/1.3 var(--mono);white-space:nowrap;color:var(--ink)}
.passage{font:400 .82rem/1.6 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;margin:0;color:var(--ink-2)}
mark{background:var(--hl);color:var(--hl-ink);padding:1px 2px;border-radius:2px}
.linkish{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:3px;cursor:pointer;text-align:left;font:inherit}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}

/* ---------- viewer ---------- */
.viewer{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:20px;align-items:start}
@media (max-width:980px){.viewer{grid-template-columns:minmax(0,1fr)}}
.paper{background:var(--surface);border:1px solid var(--line);border-radius:4px;box-shadow:0 1px 2px rgba(13,20,36,.06), 0 8px 24px -12px rgba(13,20,36,.18);padding:36px clamp(18px,4vw,48px);max-height:72vh;overflow:auto}
.paper .passage{font-size:.86rem;color:var(--ink)}
.pager{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.pager .note{font-variant-numeric:tabular-nums}
.aside{display:flex;flex-direction:column;gap:14px;position:sticky;top:76px}
.locbox{font:400 .78rem/1.55 var(--mono);color:var(--ink);background:var(--sunken);border:1px solid var(--line);border-radius:6px;padding:10px 12px;overflow-wrap:anywhere}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:.84rem}
.kv dt{color:var(--muted)}.kv dd{margin:0;color:var(--ink);overflow-wrap:anywhere}

/* ---------- audit ---------- */
.auditlog{list-style:none;margin:0;padding:0;font:400 .8rem/1.5 var(--mono)}
.auditlog li{display:grid;grid-template-columns:72px 82px minmax(0,1fr);gap:12px;padding:9px 24px;border-bottom:1px solid var(--line);color:var(--ink-2)}
.auditlog li:last-child{border-bottom:0}
.auditlog .t{color:var(--muted);font-variant-numeric:tabular-nums}
.auditlog .who{color:var(--accent)}
@media (max-width:520px){.auditlog li{grid-template-columns:64px minmax(0,1fr)}.auditlog .who{display:none}}
details.sheet summary{cursor:pointer;font-weight:600}
details ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:.88rem}
.leadcard{border:1px solid var(--line);border-radius:8px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.leadcard h3{font:400 1.08rem/1.3 var(--display)}
.srcstatus{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:.86rem}
.srcstatus li{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.checks{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:.88rem;color:var(--ink-2)}
.checks label{display:flex;align-items:center;gap:7px}
.outbound{font:500 .9rem/1.5 var(--mono);color:var(--ink);background:var(--sunken);border:1px solid var(--line);border-radius:6px;padding:10px 12px;overflow-wrap:anywhere}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>

<div class="shell">
  <aside class="side">
    <div class="brand"><span class="mark" aria-hidden="true">§</span><span class="word">lexreview</span></div>
    <div class="matter">
      <span class="label">Matter</span>
      <span class="name" id="caseName"></span>
      <span class="meta-s" id="caseMeta"></span>
    </div>
    <nav class="tabs" id="tabs" aria-label="Sections"></nav>
    <div class="side-foot">
      <span><b>Demonstration.</b> Fictional matter, synthetic documents.</span>
      <span>Runs entirely in this browser. Nothing is sent anywhere.</span>
    </div>
  </aside>
  <div class="work">
    <header class="bar"><div class="bar-in">
      <div class="crumb" id="crumb"></div>
      <div class="bar-right">
        <span class="demo-pill" title="The documents were processed by the real lexreview pipeline. In this page, search is keyword-only and Ask uses the no-model extractive mode. Encryption, MFA sign-in, the audit log and sandboxed parsing belong to the server deployment."><i aria-hidden="true"></i>Synthetic demo</span>
        <div class="role"><span class="label" id="roleLbl">Role</span>
          <div class="seg" id="roleSeg" role="group" aria-labelledby="roleLbl">
            <button type="button" data-role="reviewer" aria-pressed="true">Reviewer</button>
            <button type="button" data-role="attorney" aria-pressed="false">Attorney</button>
          </div></div>
      </div>
    </div></header>
    <main id="main" aria-live="polite"></main>
  </div>
</div>

<script type="application/json" id="data">__DATA__</script>
<script>
(function(){
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);

/* ---------- tiny DOM builder: text is always set as text, never as HTML ---------- */
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  if (attrs) for (const [k,v] of Object.entries(attrs)){
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat(Infinity)){ if (k == null || k === false) continue; el.append(k.nodeType ? k : document.createTextNode(String(k))); }
  return el;
}
const $main = document.getElementById("main");
document.getElementById("caseName").textContent = D.case.name.replace(/\s*\(fictional\)\s*$/,"");

/* ---------- state ---------- */

/* ---------- documents, visibility ---------- */
const DOC = Object.fromEntries(D.docs.map(d=>[d.doc_id,d]));
const PAGES = D.pages;
const SEARCHABLE = new Set(["indexed","indexed_low_confidence"]);
const visible = d => !d.restriction || S.role === "attorney";   // attorney holds the "aeo" grant in this demo
const topOf = id => (DOC[id] && DOC[id].parent_id) || id;
const shortName = n => n.replace(/^docs\//,"");
const STATUS = {
  indexed:["Searchable","ok"], indexed_low_confidence:["Low-confidence OCR","warn"], ocr_failed:["OCR failed","bad"],
  corrupted:["Corrupted","bad"], password_protected:["Password-protected","bad"], unsupported:["Unsupported format","bad"],
  too_large:["Too large","bad"], rejected_unsafe:["Rejected as unsafe","bad"], timeout:["Timed out","bad"],
  parse_error:["Parse error","bad"], duplicate:["Duplicate","" ] };
const EXPLAIN = {
  ocr_failed:"Scanned file: OCR recovered no text. Review manually.", corrupted:"File could not be read.",
  password_protected:"Encrypted. Obtain the password or a decrypted copy.", unsupported:"Format not supported in this build.",
  rejected_unsafe:"Rejected as unsafe (decompression or zip bomb).", too_large:"Exceeded a size or page limit.",
  timeout:"Parsing timed out.", parse_error:"Parser failed.", duplicate:"Exact duplicate of another document." };

function coverage(){
  const vis = D.docs.filter(visible);
  const searchable = vis.filter(d=>SEARCHABLE.has(d.status));
  const gaps = vis.filter(d=>!SEARCHABLE.has(d.status) && d.status !== "duplicate");
  return {total:vis.length, searchable:searchable.length, gaps, withheld:D.docs.length - vis.length};
}
function bar(c, cls){ const all = c.total + c.withheld;
  return h("div",{class:cls,"aria-hidden":"true"},
    h("span",{class:"s-ok",style:`width:${100*c.searchable/all}%;background:var(--ok)`}),
    h("span",{class:"s-bad",style:`width:${100*c.gaps.length/all}%;background:var(--bad)`}),
    h("span",{class:"s-held",style:`width:${100*c.withheld/all}%;background:var(--line-strong)`})); }
function coverageBanner(){
  const c = coverage();
  return h("div",{class:"cov",role:"note"},
    h("span",{class:"label"},"Coverage"), bar(c,"covbar"),
    h("span",null, h("b",null,`${c.searchable} of ${c.total}`), " documents searched"),
    h("span",{class:"gap"}, `${c.gaps.length} not searchable`),
    c.withheld ? h("span",null, `${c.withheld} withheld from your role`) : null,
    h("button",{class:"linkish",onclick:()=>go("overview")},"View gaps"));
}

/* ---------- text processing (mirrors the app's tokenizer) ---------- */
const STOP = new Set(("a about above after again against all am an and any are as at be because been before being below between both but by can could did do does doing down during each everything few find for from further had has have having he her here hers him his how i if in into is it its itself just me more most my no nor not of off on once only or other our out over own same she should so some such than that the their them then there these they this those through to too under until up very was we were what when where which while who whom why will with would you your show list documents docs anything regarding related concerning involving").split(" "));
function stem(t){ if (/^\d+$/.test(t) || t.length <= 4) return t;
  for (const [s,r] of [["ies","y"],["ing",""],["ed",""],["es",""],["s",""]]) if (t.endsWith(s) && !t.endsWith("ss") && t.length-s.length >= 4) return t.slice(0,t.length-s.length)+r;
  return t; }
const tokens = s => (s.toLowerCase().match(/[a-z0-9]+/g)||[]).filter(t=>t.length>1 && !STOP.has(t)).map(stem);

/* ---------- keyword index over the real passages (BM25) ---------- */
const CH = D.chunks.map(([doc,page,s,e],i)=>{ const pg = PAGES[doc].find(p=>p[0]===page); const text = pg[2].slice(s,e);
  const tf = {}; for (const t of tokens(text)) tf[t]=(tf[t]||0)+1; return {i,doc,page,s,e,text,loc:pg[1],ocr:pg[3],conf:pg[4],tf,len:text.length}; });
const DF = {}; CH.forEach(c=>{ for (const t in c.tf) DF[t]=(DF[t]||0)+1; });
const AVG = CH.reduce((a,c)=>a+c.len,0)/CH.length;
function search(q, limit){
  const qs = [...new Set(tokens(q))]; if (!qs.length) return [];
  const N = CH.length, out = [];
  for (const c of CH){
    const d = DOC[c.doc]; if (!visible(d) || !SEARCHABLE.has(d.status)) continue;   // permission filter before ranking
    let score = 0, hit = 0;
    for (const t of qs){ const f = c.tf[t]; if (!f) continue; hit++;
      const idf = Math.log(1 + (N - DF[t] + .5)/(DF[t] + .5)); score += idf * f*2.2/(f + 1.2*(.25+.75*c.len/AVG)); }
    if (!hit) continue;
    const cov = hit/qs.length;
    if (cov < .2 && qs.length > 2) continue;
    out.push({c, score, cov, band: cov >= .5 ? "strong" : cov >= .34 ? "moderate" : "weak"});
  }
  out.sort((a,b)=>b.score-a.score);
  return limit ? out.slice(0,limit) : out;
}

/* ---------- common pieces ---------- */
const BAND = {strong:"Strong match", moderate:"Moderate match", weak:"Weak match"};
function openDoc(doc, page, s, e){ S.viewer = {doc, page:page||1, s, e}; go("viewer"); }
function locText(doc, page, s, e){ const d = DOC[doc]; const pg = (PAGES[doc]||[]).find(p=>p[0]===page);
  return `${shortName(d.source_name)} | doc ${doc} | ${pg?pg[1]:"p. "+page}` + (s!=null?` | chars ${s}-${e}`:"") + (pg&&pg[3]?` | OCR confidence ${pg[4]}`:""); }
function locLink(doc, page, s, e, label){ return h("button",{class:"doclink",type:"button",onclick:()=>openDoc(doc,page,s,e)}, label || shortName(DOC[doc].source_name)); }
function flagged(doc){ return DOC[topOf(doc)].injection || DOC[doc].injection; }
function injectionLine(){ return h("div",{class:"alertline"},"This document contains text that reads like instructions to an AI system. It was treated as plain text. Review with caution."); }
function markButtons(doc, page){
  const key = doc+":"+page, cur = S.marks[key];
  const b = (label, val) => h("button",{class: cur===val ? "btn on" : "btn ghost", type:"button","aria-pressed":String(cur===val), onclick:()=>{ S.marks[key]=val; audit("mark", `${doc} p.${page} ${val}`); render(); }}, label);
  return h("div",{class:"row"}, b("Relevant","relevant"), b("Not relevant","not_relevant"), cur ? h("span",{class:"note"},"Recorded in the audit log") : null);
}
function withHighlight(text, s, e){
  if (s==null || s<0 || e>text.length || s>=e) return h("pre",{class:"passage"}, text);
  return h("pre",{class:"passage"}, text.slice(0,s), h("mark",{id:"hl"}, text.slice(s,e)), text.slice(e));
}
function pageHead(title, lede){ return h("header",{class:"pagehead"}, h("span",{class:"label"}, groupOf(S.tab==="viewer"?S.prev:S.tab)), h("h1",null,title), lede ? h("p",{class:"lede"},lede) : null); }
function suggestions(list, inp, run){ return h("div",{class:"try"}, h("span",{class:"label"},"Try"), list.map(t=>h("button",{type:"button",class:"sugg",onclick:()=>{inp.value=t;run();}},t))); }
function notFound(){ return h("div",{class:"notfound"}, h("b",null,"Not found in the reviewed documents."), h("span",{class:"note"},"Nothing in the searchable documents supports a result. Files that could not be searched are listed on the Overview.")); }

/* ---------- navigation ---------- */
const NAV = [["Matter",[["overview","Overview"]]],
  ["Review",[["search","Search"],["ask","Ask a question"],["rank","Find everything"]]],
  ["Analysis",[["timeline","Timeline"],["people","People & organizations"]]],
  ["Authority",[["legal","Legal research leads"]]],
  ["Record",[["audit","Audit log"]]]];
const TABS = NAV.flatMap(([,items])=>items);
function groupOf(tab){ for (const [g,items] of NAV) if (items.some(([k])=>k===tab)) return g; return ""; }
function labelOf(tab){ const t = TABS.find(([k])=>k===tab); return t ? t[1] : ""; }
function go(tab){ S.tab = tab; render(); window.scrollTo({top:0}); try{ if (tab !== "viewer") history.replaceState(null,"","#"+tab); }catch(e){} }

function hitCard(r, i){ const c = r.c, fl = flagged(c.doc);
  return h("article",{class:"hit"+(fl?" flagged":"")},
    h("div",{class:"hit-head"}, h("div",{class:"hit-title"}, h("span",{class:"rank"},String(i+1).padStart(2,"0")), locLink(c.doc,c.page,c.s,c.e)),
      h("div",{class:"row",style:"gap:6px"}, c.ocr?h("span",{class:"pill warn"},`OCR ${c.conf}`):null, h("span",{class:"pill "+r.band},BAND[r.band]))),
    h("div",{class:"cite"},`${c.loc} · chars ${c.s}–${c.e}`),
    fl?injectionLine():null,
    h("p",{class:"excerpt"}, c.text.length>420 ? c.text.slice(0,420)+" …" : c.text)); }

function viewSearch(){
  const inp = h("input",{type:"text",id:"q",value:S.lastSearch,placeholder:"Describe what you are looking for","aria-label":"Search this matter"});
  const box = h("div",{class:"results"});
  function run(){ S.lastSearch = inp.value.trim(); box.replaceChildren(); if (!S.lastSearch) return;
    const res = search(S.lastSearch); audit("search", `${res.length} passages (query stored encrypted; audit keeps a digest)`);
    const docs = new Set(res.map(r=>topOf(r.c.doc)));
    box.append(h("div",{class:"summary"}, h("span",null,h("b",null,res.length)," passages in ",h("b",null,docs.size)," documents"), h("span",null,`${coverage().searchable} searchable documents searched`), res.length>40?h("span",null,"Top 40 shown"):null));
    if (!res.length){ box.append(notFound()); return; }
    res.slice(0,40).forEach((r,i)=>box.append(hitCard(r,i)));
  }
  const form = h("form",{class:"sheet",onsubmit:e=>{e.preventDefault();run();}},
    h("div",{class:"query"}, inp, h("button",{class:"btn"},"Search")),
    suggestions(["trailer 4471 rejected pallets","liability per shipment","notice within two hours","zebra xylophone quantum"], inp, run));
  setTimeout(()=>{ if (S.lastSearch) run(); },0);
  return [pageHead("Search", "Plain-English search across the production. Every result is a passage from a document your role may see, with its exact location. Open a result to see the page with the passage highlighted."), form, coverageBanner(), box];
}

function locateQuote(text, quote){
  const words = quote.trim().split(/\s+/).map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));
  if (!words.length) return null; const m = new RegExp(words.join("\\s+")).exec(text); return m ? [m.index, m.index+m[0].length] : null;
}
function viewAsk(){
  const inp = h("input",{type:"text",id:"ask",value:S.lastAsk,placeholder:"Ask a question about the documents","aria-label":"Question"});
  const box = h("div",{class:"results"});
  function run(){ S.lastAsk = inp.value.trim(); box.replaceChildren(); if (!S.lastAsk) return;
    const q = new Set(tokens(S.lastAsk)), hits = search(S.lastAsk, 12), claims = [];
    for (const r of hits){ const text = r.c.text.replace(/([^\n])\n(?!\n)/g,"$1 ");
      for (const sent of text.split(/(?<=[.!?])\s+|\n\s*\n/)){ const s = sent.trim(); if (s.length < 20) continue;
        const ov = tokens(s).filter(t=>q.has(t)).length; if (ov >= Math.max(2, Math.floor(q.size/3))) claims.push({ov, s, c:r.c}); } }
    claims.sort((a,b)=>b.ov-a.ov);
    const shown = []; let dropped = 0;
    for (const cl of claims.slice(0,6)){ const pg = PAGES[cl.c.doc].find(p=>p[0]===cl.c.page)[2];
      const at = locateQuote(pg.slice(cl.c.s, cl.c.e), cl.s);    // verify the quote is really in the passage
      if (!at){ dropped++; continue; } shown.push({...cl, qs: cl.c.s+at[0], qe: cl.c.s+at[1]}); }
    audit("ask", `${shown.length} verified statements, ${dropped} removed`);
    box.append(h("div",{class:"summary"}, h("span",null,h("b",null,shown.length)," verified quotations"), h("span",null,`${hits.length} passages considered`), h("span",null,"Extractive mode: no generative model")));
    if (!shown.length){ box.append(notFound()); return; }
    for (const cl of shown){ const fl = flagged(cl.c.doc);
      box.append(h("article",{class:"hit"+(fl?" flagged":"")},
        h("div",{class:"hit-head"}, h("div",{class:"hit-title"}, locLink(cl.c.doc,cl.c.page,cl.qs,cl.qe)),
          h("div",{class:"row",style:"gap:6px"}, h("span",{class:"pill ok"},"Quote verified"), h("span",{class:"pill "+(cl.ov>=3?"strong":"moderate")}, cl.ov>=3?"Strong match":"Moderate match"))),
        h("div",{class:"cite"},`${cl.c.loc} · chars ${cl.qs}–${cl.qe}`),
        fl?injectionLine():null,
        h("blockquote",{class:"excerpt"}, "“"+cl.s+"”"))); }
  }
  const form = h("form",{class:"sheet",onsubmit:e=>{e.preventDefault();run();}},
    h("div",{class:"query"}, inp, h("button",{class:"btn"},"Ask")),
    suggestions(["What is the maximum liability per shipment?","When must Meridian give notice of a temperature excursion?","Who won the 1998 World Series?"], inp, run));
  setTimeout(()=>{ if (S.lastAsk) run(); },0);
  return [pageHead("Ask a question", "Answers are built only from quotations checked word for word against the passage they came from. If nothing checks out, the answer is “Not found in the reviewed documents.”"), form, coverageBanner(), box];
}

/* ---------- instruction parsing for "find everything" (mirrors rank.py) ---------- */
const MONTHS = {january:1,jan:1,february:2,feb:2,march:3,mar:3,april:4,apr:4,may:5,june:6,jun:6,july:7,jul:7,august:8,aug:8,september:9,sep:9,sept:9,october:10,oct:10,november:11,nov:11,december:12,dec:12};
function parseInstruction(text){
  const re = /(?<![A-Za-z])(january|february|march|april|may|june|july|august|september|october|november|december|sept|jan|feb|mar|apr|jun|jul|aug|sep|oct|nov|dec)\.?(?:\s{1,3}(\d{1,2})(?!\d)(?:st|nd|rd|th)?)?(?:,?\s{1,3}((?:19|20)\d{2}))?(?![A-Za-z])/gi;
  const pts = [], spans = []; let m, notes = [];
  while ((m = re.exec(text))){ if (m[1].toLowerCase()==="may" && m[1]!=="May") continue;
    pts.push([m.index, MONTHS[m[1].toLowerCase()], m[2]?+m[2]:null, m[3]?+m[3]:null]); spans.push([m.index, m.index+m[0].length]); }
  pts.forEach((p,i)=>{ if (p[3]==null){ const later = pts.slice(i+1).find(q=>q[3]); const earlier = pts.slice(0,i).reverse().find(q=>q[3]);
    p[3] = later ? later[3] : earlier ? earlier[3] : null; if (p[3]==null) notes.push("A month in the instruction has no year; it was not used as a date filter."); } });
  const ok = pts.filter(p=>p[3]); const iso = (y,mo,d)=>`${y}-${String(mo).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
  const last = (y,mo)=>new Date(Date.UTC(y,mo,0)).getUTCDate();
  let from=null, to=null;
  if (ok.length){ const pre = text.slice(Math.max(0,ok[0][0]-12), ok[0][0]).toLowerCase();
    const f = p=>iso(p[3],p[1],p[2]||1), l = p=>iso(p[3],p[1],p[2]||last(p[3],p[1]));
    if (ok.length===1 && /\b(after|since|from)\s*$/.test(pre)) from = f(ok[0]);
    else if (ok.length===1 && /\b(before|until|by)\s*$/.test(pre)) to = l(ok[0]);
    else { from = ok.map(f).sort()[0]; to = ok.map(l).sort().slice(-1)[0]; } }
  let topic = text; spans.sort((a,b)=>b[0]-a[0]).forEach(([a,b])=>{ topic = topic.slice(0,a)+" "+topic.slice(b); });
  const names = D.entities.filter(e=>text.toLowerCase().includes(e.name.toLowerCase()) || (e.kind==="org" && text.toLowerCase().split(/\W+/).includes(e.name.split(" ")[0].toLowerCase())));
  topic = topic.replace(/\b(find|show|list|give|get|everything|anything|all|documents?|docs|files?|relevant|related|regarding|concerning|about|involving|between|from|to|and|in|during|after|since|before|until|by|on|of|the|a|an|me|build|chronology|timeline|events?)\b/gi," ").replace(/\s+/g," ").trim();
  return {topic, from, to, names, notes};
}
function viewRank(){
  const inp = h("input",{type:"text",id:"rank",value:S.lastRank,"aria-label":"Instruction"});
  const box = h("div",{class:"results"});
  function run(){ S.lastRank = inp.value.trim(); box.replaceChildren(); if (!S.lastRank) return;
    const p = parseInstruction(S.lastRank); const hits = search(p.topic || S.lastRank);
    const docs = new Map();
    for (const r of hits){ const top = topOf(r.c.doc); if (!docs.has(top)) docs.set(top,{top, best:r, n:0, names:[]}); docs.get(top).n++; }
    for (const e of p.names) for (const [doc] of e.mentions){ const d = DOC[doc]; if (!visible(d)) continue; const top = topOf(doc);
      if (!docs.has(top)) docs.set(top,{top, best:null, n:0, names:[]}); const x = docs.get(top); if (!x.names.includes(e.name)) x.names.push(e.name); }
    const evBy = {}; for (const ev of D.events){ const top = topOf(ev.doc_id); (evBy[top] = evBy[top]||[]).push(ev); }
    const L = {ranked:[], undated:[], outside:[]};
    for (const x of docs.values()){ const evs = evBy[x.top]||[];
      const inR = evs.filter(ev=>(!p.from || ev.date_end >= p.from) && (!p.to || ev.date_start <= p.to)).map(ev=>ev.date_start);
      x.inRange = [...new Set(inR)].sort(); x.all = [...new Set(evs.map(e=>e.date_start))].sort();
      x.score = (x.best? x.best.score : 0) + .3*x.n + 2*x.names.length;
      if ((p.from||p.to) && !evs.length) L.undated.push(x); else if ((p.from||p.to) && !inR.length) L.outside.push(x); else L.ranked.push(x); }
    for (const k in L) L[k].sort((a,b)=>b.score-a.score);
    audit("find everything", `${L.ranked.length} ranked, ${L.undated.length} undated, ${L.outside.length} outside range`);
    box.append(h("div",{class:"sheet"}, h("span",{class:"label"},"How your instruction was read"),
      h("dl",{class:"kv"}, h("dt",null,"Topic"), h("dd",null,p.topic||"none"), h("dt",null,"Date range"), h("dd",null,p.from||p.to ? (p.from||"any")+" to "+(p.to||"any") : "none"),
        h("dt",null,"People / organizations"), h("dd",null,p.names.map(n=>n.name).join(", ")||"none")),
      p.notes.map(n=>h("div",{class:"warnline"},n))));
    const list = (title, note, arr) => { if (!arr.length) return; box.append(h("div",{class:"listhead"}, h("h2",null,title,h("span",{class:"n"},arr.length)), h("p",{class:"note"},note)));
      arr.forEach((x,i)=>{ const d = DOC[x.top], b = x.best ? x.best.c : null, fl = d.injection;
        const reasons = [x.n?`${x.n} matching passage${x.n>1?"s":""}`:null, x.names.length?"mentions "+x.names.join(", "):null, x.inRange.length&&(p.from||p.to)?"dated in range: "+x.inRange.slice(0,3).join(", "):null].filter(Boolean);
        box.append(h("article",{class:"hit"+(fl?" flagged":"")},
          h("div",{class:"hit-head"}, h("div",{class:"hit-title"}, h("span",{class:"rank"},String(i+1).padStart(2,"0")), b ? locLink(b.doc,b.page,b.s,b.e,shortName(d.source_name)) : locLink(x.top,1,null,null)),
            x.best?h("span",{class:"pill "+x.best.band},BAND[x.best.band]):h("span",{class:"pill plain"},"Name match")),
          fl?injectionLine():null, h("div",{class:"reasons"}, reasons.join(" · ") + (x.all.length?` · dates found: ${x.all.slice(0,4).join(", ")}`:"")),
          b ? h("p",{class:"excerpt"}, b.text.slice(0,260)+(b.text.length>260?" …":"")) : null, markButtons(b?b.doc:x.top, b?b.page:1))); }); };
    list("Ranked","Matches your instruction.",L.ranked);

/* ---------- legal leads (approval workflow; fixture responses) ---------- */
const GRAMS = new Set(); CH.forEach(c=>{ const w = c.text.toLowerCase().match(/[a-z0-9]+/g)||[]; for (let i=0;i+4<w.length;i++) GRAMS.add(w.slice(i,i+5).join(" ")); });
const ALLTEXT = CH.map(c=>c.text).join("\n");
function checkQuery(text){
  const blocks = [], warns = [], w = text.toLowerCase().match(/[a-z0-9]+/g)||[];
  for (let i=0;i+4<w.length;i++) if (GRAMS.has(w.slice(i,i+5).join(" "))){ blocks.push("contains a 5-word phrase copied from a case document"); break; }
  const low = text.toLowerCase(), hits = [];
  for (const e of D.entities){ const forms = new Set([e.name.toLowerCase()]); const parts = e.name.split(" ");
    if (e.kind==="person" && parts.at(-1).length>3) forms.add(parts.at(-1).toLowerCase());
    if (e.kind==="org"){ forms.add(e.name.replace(/,?\s(Inc|LLC|Corp|Co|Ltd|LLP)\.?$/,"").toLowerCase()); if (parts[0].length>=5) forms.add(parts[0].toLowerCase()); }
    for (const f of forms) if (new RegExp("(?<![a-z0-9])"+f.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"(?![a-z0-9])").test(low)){ hits.push(e.name); break; } }
  if (hits.length) warns.push("names a person or organization from this case: "+[...new Set(hits)].join(", "));
  for (const n of new Set(text.match(/\b\d{4,}\b/g)||[])) if (!(n.length===4 && /^(19|20)/.test(n)) && ALLTEXT.includes(n)) warns.push(`contains the number ${n}, which appears in case documents`);
  return {blocks, warns};
}
const SRC = {courtlistener:"CourtListener (case law)", ohio_code:"Ohio Revised Code", mi_code:"Michigan Compiled Laws", ecfr:"eCFR (federal regulations)", govinfo:"govinfo (U.S. Code)"};

  function propose(e){ e.preventDefault(); const t = txt.value.replace(/\s+/g," ").trim(); msg.replaceChildren();
    if (t.length<3){ msg.append(h("div",{class:"warnline"},"Write a search of at least 3 characters.")); return; }

    if (blocks.length){ audit("legal propose","blocked: document text"); msg.append(h("div",{class:"callout caution"},h("b",null,"Not saved. The text "+blocks.join("; ")+"."),"Rewrite it as a general legal issue without text from the documents.")); return; }
    const sources = [...document.querySelectorAll('input[name=src]:checked')].map(x=>x.value), juris = [...document.querySelectorAll('input[name=jur]:checked')].map(x=>x.value);
    if (!sources.length || !juris.length){ msg.append(h("div",{class:"warnline"},"Choose at least one source and one jurisdiction.")); return; }
    S.legal.unshift({id:"lq_"+Math.random().toString(16).slice(2,10), text:t, sources, juris, warns, status:"proposed", by:S.role});
    audit("legal propose", `${warns.length} warning(s); text recorded as digest`); render(); }
  const cards = S.legal.map(q=>{ const ack = h("input",{type:"checkbox",id:"ack_"+q.id});
    let act = null;
    if (q.status==="proposed") act = att ? h("div",{style:"display:flex;flex-direction:column;gap:10px"}, q.warns.length?h("label",{class:"row",style:"gap:8px;font-size:.88rem"},ack,"I have read the warnings and approve sending this anyway"):null,

      h("div",{class:"outbound"},q.text),
      h("dl",{class:"kv"}, h("dt",null,"Sources"), h("dd",null,q.sources.map(s=>SRC[s]).join(", ")), h("dt",null,"Jurisdictions"), h("dd",null,q.juris.join(", "))),
      q.warns.map(w=>h("div",{class:"warnline"},"Warning: "+w)), act, leads);

    h("div",{class:"callout"}, h("b",null,"An attorney approves the exact text of every outside search before it is sent."), "These searches leave the firm, so write general legal issues without client, party or case details."),
    att ? h("form",{class:"sheet",onsubmit:propose},
        h("label",{for:"lq",class:"label"},"Proposed search text · sent exactly as written, after approval"), txt,
        h("div",{style:"display:flex;flex-direction:column;gap:6px"}, h("span",{class:"label"},"Sources"), h("div",{class:"checks"},srcBoxes)),
        h("div",{style:"display:flex;flex-direction:column;gap:6px"}, h("span",{class:"label"},"Jurisdictions"), h("div",{class:"checks"},jurBoxes)),
        h("div",{class:"row"}, h("button",{class:"btn"},"Propose search")),
        h("p",{class:"note"},"To see the safeguards, try one that names a party, such as “Meridian Freightways notice duty trailer 4471”, or one copied from a document, such as “Meridian shall maintain product between 2 and 8 degrees”."), msg)
      : h("div",{class:"notfound"}, h("b",null,"Reviewers can read leads but cannot propose or approve searches."), h("span",{class:"note"},"Switch the role to Attorney in the top bar to try the approval workflow.")),
    ...cards];
}
